[package]
name = "nabla"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
crossterm = "0.29.0"
ignore = "0.4"
pulldown-cmark = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
